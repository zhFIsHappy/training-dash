<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>训练进步</title>
<style>
/* 比分板: template rail on the left, the main area is "last time vs this time" for one template,
   the change column set huge like a scoreboard. Dark by default (read in the gym, between sets). */
:root {
  --ground: #0c0d0c; --rail: #151715; --ink: #f1f2ee; --ink2: #9ba19c; --step: #1d201d;
  --accent: #ff8a1f; --up: #3ddc84; --down: #ff5c4d; --flat: #7d837e;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --ground: #f2f2ef; --rail: #e6e7e3; --ink: #111311; --ink2: #555b56; --step: #e9eae6; --accent: #c85f00; --up: #0f8a4b; --down: #c8352a; --flat: #6c726d; color-scheme: light; } }
:root[data-theme="light"] { --ground: #f2f2ef; --rail: #e6e7e3; --ink: #111311; --ink2: #555b56; --step: #e9eae6; --accent: #c85f00; --up: #0f8a4b; --down: #c8352a; --flat: #6c726d; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.5 var(--sans); }
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
aside { background: var(--rail); padding: 28px 12px; }
aside h1 { font-size: 17px; margin: 0 12px 20px; letter-spacing: -0.01em; }
aside button { all: unset; display: grid; grid-template-columns: 1fr auto; width: 100%; box-sizing: border-box; padding: 10px 12px; cursor: pointer; border-radius: 6px; }
aside button .d { color: var(--ink2); font-size: 13px; font-variant-numeric: tabular-nums; }
aside button[aria-current="true"] { background: var(--ground); }
aside button[aria-current="true"] .t { color: var(--accent); font-weight: 600; }
aside button:focus-visible { outline: 2px solid var(--accent); }
aside .old { color: var(--ink2); font-size: 13px; margin: 24px 12px 6px; }
main { padding: 36px clamp(16px, 4vw, 56px) 64px; min-width: 0; }
.head h2 { font-size: 44px; line-height: 1; letter-spacing: -0.03em; margin: 0; }
.head p { color: var(--ink2); margin: 10px 0 0; font-size: 16px; }
.hl { font-variant-numeric: tabular-nums; } .hl .bad { color: var(--down); }
.head .hl { margin-top: 6px; font-size: 15px; }
.score { margin-top: 36px; width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.score th { text-align: right; color: var(--ink2); font-weight: 500; font-size: 13px; padding: 0 12px 10px; }
.score th:first-child { text-align: left; }
.score td { padding: 16px 12px; text-align: right; background: var(--step); white-space: nowrap; }
.score tr + tr td { border-top: 6px solid var(--ground); }
.score td:first-child { text-align: left; white-space: normal; }
.score .n { font-size: 17px; font-weight: 600; } .score .p { color: var(--ink2); font-size: 13px; }
.score td.sets { text-align: left; white-space: normal; }
.line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
.line .lb { color: var(--ink2); font-size: 13px; width: 2.6em; flex: none; }
.line .r { margin-left: 8px; }
.line.was { color: var(--ink2); font-size: 15px; margin-bottom: 4px; }
.line.now { font-size: 21px; font-weight: 600; }
.line .u { color: var(--ink2); font-size: 13px; font-weight: 400; }
.line .r.up, .line .w.up { color: var(--up); } .line .r.down, .line .w.down { color: var(--down); }
.score .chg { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; min-width: 4.5em; }
.score .chg small { display: block; font-size: 13px; font-weight: 500; letter-spacing: 0; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
.hint { color: var(--accent); font-size: 13px; font-weight: 600; }
.strip { margin-top: 56px; }
.strip h3 { font-size: 18px; margin: 0 0 14px; }
.strip .row { display: grid; grid-template-columns: 4.5em 1fr minmax(0, 15em); gap: 12px; align-items: center; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.strip .row .d, .strip .row .hl { color: var(--ink2); font-size: 13px; }
.strip .cells { display: flex; gap: 4px; }
.strip .cells i { flex: 1; height: 26px; border-radius: 3px; background: var(--step); }
.ov h3 { font-size: 20px; letter-spacing: -0.01em; margin: 56px 0 4px; }
.ov h3 + p { color: var(--ink2); margin: 0; }
.ov .score { margin-top: 16px; }
.ov .tally { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin-top: 14px; font-variant-numeric: tabular-nums; }
.ov .tally span + span { margin-left: 22px; }
.ov .tally small { font-size: 15px; font-weight: 500; margin-left: 4px; }
.ov .tpl { font-size: 15px; font-weight: 600; margin: 28px 0 0; color: var(--ink2); }
.ov .fromto { font-size: 19px; font-weight: 600; } .ov .fromto .was { color: var(--ink2); font-weight: 400; font-size: 16px; }
.ov .empty { color: var(--ink2); margin-top: 12px; }
.warn { color: var(--accent); }
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); align-content: start; }
  aside { padding: 12px 0 0; min-width: 0; } aside h1, aside .old { display: none; }
  #rail { display: flex; gap: 4px; overflow-x: auto; padding: 0 12px 12px; scrollbar-width: none; }
  aside button { width: auto; white-space: nowrap; grid-template-columns: auto; padding: 8px 12px; } aside button .d { display: none; }
  main { padding-top: 24px; }
  .head h2 { font-size: 32px; }
  /* each lift becomes a block: name + change on one line, the set lines full width under it */
  .score thead { display: none; }
  .score, .score tbody { display: block; }
  .score tr { display: grid; grid-template-columns: 1fr auto; background: var(--step); margin-bottom: 6px; }
  .score td { display: block; background: none; padding: 14px 14px 0; }
  .score tr + tr td { border-top: 0; }
  .score td:first-child { grid-area: 1 / 1; }
  .score td.chg { grid-area: 1 / 2; }
  .score td.sets { grid-area: 2 / 1 / 3 / 3; padding: 10px 14px 14px; }
  .score .chg { font-size: 24px; min-width: 0; }
  .line.now { font-size: 19px; }
  .strip .row { grid-template-columns: 3.5em minmax(0, 1fr); row-gap: 2px; }
  .strip .row .hl { grid-column: 2; }
}
</style>
</head>
<body>
<div class="app">
  <aside><h1>训练进步</h1><div id="rail"></div></aside>
  <main>
    <div id="ov" class="ov" hidden></div>
    <div id="tv">
    <div class="head"><h2 id="title"></h2><p id="sub"></p><p id="hl" class="hl"></p></div>
    <table class="score"><thead><tr><th>动作</th><th style="text-align:left">每组 重量 × 次数</th><th>变化</th></tr></thead><tbody id="rows"></tbody></table>
    <section class="strip"><h3>这个模板每次的结果</h3><div id="strip"></div></section>
    </div>
  </main>
</div>
<script>/*__DATA__*/</script>
<script>/*__COMMON__*/</script>
<script>
(() => {
  const cls = (v) => UP.includes(v) ? 'up' : v === 'down' ? 'down' : 'flat';
  const fill = (v) => UP.includes(v) ? 'var(--up)' : v === 'down' ? 'var(--down)' : v === 'same' ? 'var(--flat)' : 'transparent';
  const OV = '总览';
  let tpl = store.get('view') || OV;
  if (tpl !== OV && !D.templates.some(t => t.name === tpl)) tpl = OV;
  const rail = $('rail');
  { const b = el('button'); b.append(el('span', 't', OV), el('span', 'd', '')); b.onclick = () => { tpl = OV; draw(); }; b.dataset.t = OV; rail.append(b); }
  D.templates.forEach((t, i) => {
    if (!t.plan && (i === 0 || D.templates[i - 1].plan)) rail.append(el('div', 'old', '之前的计划'));
    const b = el('button'); b.append(el('span', 't', t.name), el('span', 'd', md(t.last_date)));
    b.onclick = () => { tpl = t.name; draw(); }; b.dataset.t = t.name; rail.append(b);
  });
  const near = (a, b) => Math.abs(a - b) <= 0.01 * Math.max(a, b, 1);
  // all working sets, consecutive same weight grouped: "50 × 12 12 11 10"; reps at the best weight coloured vs last time
  function line(label, m, ref, cls) {
    const row = el('div', 'line ' + cls); row.append(el('span', 'lb', label));
    const work = m.sets.filter(s => s[2] !== '热'), groups = [];
    for (const s of work) { const g = groups[groups.length - 1]; if (g && near(g.lbs, s[0])) g.r.push(s[1]); else groups.push({ lbs: s[0], r: [s[1]] }); }
    const sameBest = ref && near(m.best[0], ref.best[0]);
    const refReps = ref ? ref.sets.filter(s => s[2] !== '热' && near(s[0], ref.best[0])).map(s => s[1]) : [];
    let k = 0;
    for (const g of groups) {
      const isBest = near(g.lbs, m.best[0]), grp = el('span');
      const w = el('span', 'w', g.lbs > 0 ? `${m.assist ? '辅助 ' : ''}${wv(g.lbs, m.unit)} ×` : '自重 ×');
      if (ref && !sameBest && isBest) w.classList.add(UP.includes(m.verdict) ? 'up' : m.verdict === 'down' ? 'down' : 'x');
      grp.append(w);
      for (const r of g.r) {
        const e = el('span', 'r', r);
        if (sameBest && isBest) { const p = refReps[k++]; if (p == null || r > p) e.classList.add('up'); else if (r < p) e.classList.add('down'); }
        grp.append(e);
      }
      row.append(grp);
    }
    if (cls === 'now') row.append(el('span', 'u', unitTxt(m)));
    return row;
  }
  function healthTxt(d) {  // Apple Health that day; red = clearly worse than the 7 days before
    const h = d.health; if (!h) return [];
    const parts = [['sleep', '睡', 'h'], ['deep', '深睡', ''], ['hrv', 'HRV', ''], ['rhr', '静息', '']].filter(([k]) => h[k] != null);
    return parts.flatMap(([k, lb, u], i) => [...(i ? [' · '] : []), el('span', h.bad.includes(k) ? 'bad' : null, `${lb} ${h[k]}${u}`)]);
  }
  function draw() {
    rail.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.t === tpl));
    store.set('view', tpl);
    $('ov').hidden = tpl !== OV; $('tv').hidden = tpl === OV;
    if (tpl === OV) return drawOverview();
    const sess = sessionsOf(tpl), cur = sess[sess.length - 1], c = tally(cur.moves);
    const ups = (c.weight || 0) + (c.reps || 0);
    $('title').textContent = `${tpl} · ${md(cur.date)}`;
    $('sub').textContent = `${cur.moves.length} 个动作:${ups} 个进步,${c.same || 0} 个持平,${c.down || 0} 个退步` + ((c.first || 0) + (c.swap || 0) ? `,${(c.first || 0) + (c.swap || 0)} 个没法比(首次或换了动作)` : '') + '。';
    $('hl').textContent = ''; $('hl').append(...healthTxt(cur));
    const tb = $('rows'); tb.textContent = '';
    for (const m of cur.moves) {
      const prev = prevOf(tpl, cur.date, m), tr = el('tr');
      const ex = el('td'); ex.append(el('div', 'p', `第 ${m.pos} 个`), el('div', 'n', m.name));
      if (m.add_weight) ex.append(el('div', 'hint', m.assist ? '下次可以减辅助' : '下次可以加重'));
      if (m.stall) ex.append(el('div', 'hint', '连续 3 次没进步'));
      const chg = el('td', 'chg ' + cls(m.verdict)); chg.append(deltaTxt(m, prev) || '—', el('small', null, VL[m.verdict]));
      const sets = el('td', 'sets'); if (prev) sets.append(line('上次', prev, null, 'was')); sets.append(line('这次', m, prev, 'now'));
      tr.append(ex, sets, chg);
      tb.append(tr);
    }
    const st = $('strip'); st.textContent = '';
    for (const d of sess.slice(-8).reverse()) {
      const r = el('div', 'row'), cells = el('div', 'cells');
      r.append(el('span', 'd', md(d.date)));
      for (const m of d.moves) { const i = el('i'); i.style.background = fill(m.verdict); if (!fill(m.verdict).startsWith('var')) i.style.outline = '1px dashed var(--flat)'; i.title = `第 ${m.pos} 个 ${m.name}:${VL[m.verdict]}`; cells.append(i); }
      const h = el('span', 'hl'); h.append(...healthTxt(d));
      r.append(cells, h); st.append(r);
    }
  }
  // ---- 总览: rotation, progress since the plan started, stuck slots ----
  const dayN = (s) => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5;
  const todayStr = (() => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; })();
  const better = (m, a, b) => {  // compare best sets a → b: 1 up, 0 same, -1 down (assisted: lighter is better)
    if (!near(a[0], b[0])) return (b[0] > a[0]) !== !!m.assist ? 1 : -1;
    return Math.sign(b[1] - a[1]);
  };
  function table(rows) {  // rows: [name cell, middle cell, change cell, change class]
    const t = el('table', 'score'), tb = el('tbody');
    for (const [a, b, c, k] of rows) { const tr = el('tr'), td3 = el('td', 'chg ' + (k || '')); td3.append(...c); const td2 = el('td', 'sets'); td2.append(...b); const td1 = el('td'); td1.append(...a); tr.append(td1, td2, td3); tb.append(tr); }
    t.append(tb); return t;
  }
  function drawOverview() {
    const box = $('ov'); box.textContent = '';
    const planDays = D.days.filter(d => D.templates.find(t => t.name === d.template)?.plan);
    if (!planDays.length) { box.append(el('p', 'empty', '还没有增肌计划的训练。')); return; }
    const head = el('div', 'head'); head.append(el('h2', null, '总览'), el('p', null, `增肌计划从 ${md(planDays[0].date)} 开始,练了 ${planDays.length} 次,最近一次 ${md(planDays[planDays.length - 1].date)}。`));
    box.append(head);

    // 1. rotation: per body part, days since last, which version is next
    box.append(el('h3', null, '每个部位多久没练了'), el('p', null, '计划是练 3 休 1、练 2 休 1,每个部位大约 7 天一次,两个版本轮着来。超过 7 天标橙,超过 14 天标红。'));
    const parts = new Map();
    for (const t of D.templates.filter(t => t.plan)) { const k = t.name.split('·')[0]; (parts.get(k) || parts.set(k, []).get(k)).push(t); }
    const rot = [...parts].map(([k, ts]) => {
      ts.sort((a, b) => a.last_date < b.last_date ? 1 : -1);
      return { k, lastT: ts[0], next: ts.length > 1 ? ts[ts.length - 1].name : ts[0].name, gap: dayN(todayStr) - dayN(ts[0].last_date) };
    }).sort((a, b) => b.gap - a.gap);
    box.append(table(rot.map(r => {
      const cls = r.gap > 14 ? 'down' : r.gap > 7 ? 'warn' : 'flat';
      const big = el('span', null, `${r.gap} 天`);
      return [[el('div', 'n', r.k)], [el('div', 'fromto', `上次 ${md(r.lastT.last_date)} · ${r.lastT.name}`), el('div', 'p', `下次轮到 ${r.next}`)], [big, el('small', null, r.gap > 14 ? '太久了' : r.gap > 7 ? '该练了' : '正常')], cls];
    })));
    const gaps = [];
    for (let i = 1; i < planDays.length; i++) { const g = dayN(planDays[i].date) - dayN(planDays[i - 1].date); if (g > 3) gaps.push(`${md(planDays[i - 1].date)} → ${md(planDays[i].date)} 停了 ${g} 天`); }
    if (gaps.length) box.append(el('p', 'empty', '中断:' + gaps.join(';')));

    // 2. since the plan started: first vs latest at each slot
    const blocks = [], single = []; const n = { 1: 0, 0: 0, '-1': 0 };
    for (const t of D.templates.filter(t => t.plan)) {
      const s = sessionsOf(t.name);
      if (s.length < 2) { single.push(t.name); continue; }
      const rows = [];
      for (const m of s[s.length - 1].moves) {
        const f = s[0].moves.find(y => y.name === m.name && y.pos === m.pos);
        if (!f) continue;
        const v = better(m, f.best, m.best); n[v]++;
        const ft = el('div', 'fromto'); ft.append(el('span', 'was', setTxt(f.best, { ...f, unit: m.unit }) + ' → '), setTxt(m.best, m), el('span', 'u', ' ' + unitTxt(m)));
        const dw = wv(m.best[0], m.unit) - wv(f.best[0], m.unit), dr = m.best[1] - f.best[1];
        const big = !near(m.best[0], f.best[0]) ? `${dw > 0 ? '+' : '−'}${Math.abs(Math.round(dw * 10) / 10)} ${unitTxt(m)}` : dr ? `${dr > 0 ? '+' : '−'}${Math.abs(dr)} 次` : '±0';
        rows.push([[el('div', 'p', `第 ${m.pos} 个`), el('div', 'n', m.name)], [ft], [big, el('small', null, v > 0 ? '进步' : v < 0 ? '退步' : '持平')], v > 0 ? 'up' : v < 0 ? 'down' : 'flat']);
      }
      if (rows.length) blocks.push([t.name, s[0].date, s[s.length - 1].date, rows]);
    }
    box.append(el('h3', null, '计划开始以来'), el('p', null, '每个位置第一次和最近一次的最佳组相比。'));
    const tl = el('div', 'tally');
    for (const [k, lab, c] of [[1, '进步', 'up'], [0, '持平', 'flat'], [-1, '退步', 'down']]) { const sp = el('span', c, String(n[k])); sp.append(el('small', null, lab)); tl.append(sp); }
    box.append(tl);
    for (const [name, a, b, rows] of blocks) { box.append(el('div', 'tpl', `${name} · ${md(a)} → ${md(b)}`), table(rows)); }
    if (single.length) box.append(el('p', 'empty', `只练过 1 次,还没法比:${single.join('、')}`));

    // 3. stuck: latest slot stalled (3 in a row without ↑) or down twice in a row
    box.append(el('h3', null, '卡住的动作'), el('p', null, '连续 3 次没涨,或者连续 2 次退步。'));
    const stuck = [];
    for (const t of D.templates) {
      const s = sessionsOf(t.name); if (!s.length) continue;
      for (const m of s[s.length - 1].moves) {
        const hist = s.map(d => d.moves.find(y => y.name === m.name && y.pos === m.pos)).filter(Boolean).map(y => y.verdict).filter(v => COMPARABLE.includes(v));
        const down2 = hist.length >= 2 && hist.slice(-2).every(v => v === 'down');
        if (m.stall || down2) stuck.push([[el('div', 'p', `${t.name}${t.plan ? '' : '(之前的计划)'} · 第 ${m.pos} 个`), el('div', 'n', m.name)], [el('div', 'fromto', `最近 ${md(s[s.length - 1].date)}:${setTxt(m.best, m)} ${unitTxt(m)}`)], [down2 ? '连退 2 次' : '3 次没涨'], down2 ? 'down' : 'warn']);
      }
    }
    if (stuck.length) box.append(table(stuck));
    else box.append(el('p', 'empty', '目前没有。'));
  }
  const COMPARABLE = ['weight', 'reps', 'same', 'down', 'watch'];
  // health is encrypted (build.py encrypt_health); key from #k=… once, then remembered on this device
  async function unlock() {
    const k = new URLSearchParams(location.hash.slice(1)).get('k') || store.get('hk');
    if (!window.HEALTH || !k) return;
    try {
      const b = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
      const key = await crypto.subtle.importKey('raw', b(k), 'AES-GCM', false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(HEALTH.iv) }, key, b(HEALTH.ct));
      const h = JSON.parse(new TextDecoder().decode(pt));
      for (const d of D.days) if (h[d.date]) d.health = h[d.date];
      store.set('hk', k);
    } catch (e) {}
  }
  unlock().then(draw);
})();
</script>
</body>
</html>
